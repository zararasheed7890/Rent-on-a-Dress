<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Collection | ROAD — Rent On A Dress</title>
  <meta name="description" content="Browse ROAD's curated collection of luxury party, cocktail, evening, and formal rental dresses." />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/public.css" />
</head>
<body>
  <!-- Shared Header Mount -->
  <div id="site-header-mount"></div>

  <main>
    <!-- Page Hero -->
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Curated Couture Catalogue</span>
        <h1>The Dress Collection</h1>
        <p>Filter by occasion, size, shade, or daily rental price to find your statement silhouette.</p>
      </div>
    </section>

    <!-- Collection Filters & Product Grid -->
    <section class="container shop-layout">
      <!-- Left Sidebar Filters (Collapsible on mobile, Sticky on desktop) -->
      <aside class="filter-sidebar" aria-label="Collection Filters">
        <div class="filter-header">
          <div style="display:flex; align-items:center; gap: 10px;">
            <h2 style="font-size: var(--text-xl);">Refine By</h2>
            <button type="button" class="mobile-filter-toggle-btn" id="mobile-filter-toggle" aria-expanded="true">
              Hide Filters ▲
            </button>
          </div>
          <button type="button" id="filter-reset-btn" style="font-size: var(--text-xs); color: var(--color-gold-dark); font-weight: 600; text-decoration: underline;">
            Reset All
          </button>
        </div>

        <div class="filter-body" id="filter-body-content">
          <!-- Category / Style Filter -->
          <div class="filter-group">
            <div class="filter-group-title">Category / Style</div>
            <div class="size-filter-grid" id="filter-categories">
              <!-- Populated dynamically by js/shop.js -->
            </div>
          </div>

          <!-- Size Filter -->
          <div class="filter-group">
            <div class="filter-group-title">Size</div>
            <div class="size-filter-grid" id="filter-sizes">
              <button type="button" class="filter-chip active" data-size="All">All</button>
              <button type="button" class="filter-chip" data-size="XS">XS</button>
              <button type="button" class="filter-chip" data-size="S">S</button>
              <button type="button" class="filter-chip" data-size="M">M</button>
              <button type="button" class="filter-chip" data-size="L">L</button>
              <button type="button" class="filter-chip" data-size="XL">XL</button>
            </div>
          </div>

          <!-- Color Filter -->
          <div class="filter-group">
            <div class="filter-group-title">Color Palette</div>
            <div class="size-filter-grid" id="filter-colors">
              <!-- Populated dynamically by js/shop.js -->
            </div>
          </div>

          <!-- Price Range Filter -->
          <div class="filter-group" style="margin-bottom: 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
              <span class="filter-group-title" style="margin-bottom:0;">Daily Price</span>
              <span id="filter-price-label" style="font-size: var(--text-xs); font-weight: 600; color: var(--color-gold-dark);">Up to Rs. 20,000</span>
            </div>
            <input
              type="range"
              id="filter-price-range"
              min="2000"
              max="25000"
              step="500"
              value="25000"
              style="width: 100%; accent-color: var(--color-gold-dark); cursor: pointer;"
            />
          </div>
        </div>
      </aside>

      <!-- Right Content Area -->
      <div>
        <!-- Search & Sort Toolbar -->
        <div class="shop-toolbar">
          <div class="search-input-wrap">
            <svg class="search-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="search"
              id="shop-search-input"
              class="form-control"
              placeholder="Search by dress name, fabric, color..."
              aria-label="Search dresses"
            />
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
            <span id="shop-results-count" style="font-size: var(--text-xs); color: var(--color-text-muted);">Loading collection...</span>
            <select id="shop-sort-select" class="form-control" style="width: auto; padding: 0.6rem 1rem;" aria-label="Sort dresses">
              <option value="featured">Sort: Featured First</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
        </div>

        <!-- Product Grid -->
        <div class="dress-grid" id="shop-dresses-grid">
          <!-- Populated dynamically by js/shop.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Footer Mount -->
  <div id="site-footer-mount"></div>

  <script type="module" src="js/shop.js"></script>
</body>
</html>
